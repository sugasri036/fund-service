# =====================================================
# APPLICATION
# =====================================================

spring.application.name=fund-service

server.port=${PORT:8081}


# =====================================================
# DATABASE
# =====================================================

spring.datasource.url=${DATABASE_URL}

spring.datasource.username=${DB_USERNAME}

spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver


# =====================================================
# JPA
# =====================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true


# =====================================================
# HIKARI CONNECTION POOL
# =====================================================

spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}

spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}

spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}

spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}

spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}


# =====================================================
# NAV SCHEDULER
# =====================================================

# Normal Fund Service pods:
# NAV_SCHEDULER_ENABLED=false
#
# Dedicated NAV scheduler:
# NAV_SCHEDULER_ENABLED=true

nav.scheduler.enabled=${NAV_SCHEDULER_ENABLED:false}

nav.scheduler.fixed-rate=${NAV_SCHEDULER_FIXED_RATE:3600000}

nav.scheduler.lookback-days=${NAV_SCHEDULER_LOOKBACK_DAYS:1}


# =====================================================
# EUREKA
# =====================================================

eureka.client.enabled=${EUREKA_ENABLED:false}

eureka.client.register-with-eureka=${EUREKA_REGISTER:false}

eureka.client.fetch-registry=${EUREKA_FETCH:false}


# =====================================================
# ACTUATOR
# =====================================================

management.endpoints.web.exposure.include=health,info,metrics

management.endpoint.health.probes.enabled=true

management.endpoint.health.probes.add-additional-paths=true

management.endpoint.health.show-details=never