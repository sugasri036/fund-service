apiVersion: apps/v1

kind: Deployment

metadata:
  name: fund-service
  namespace: investra

spec:

  replicas: 2

  selector:
    matchLabels:
      app: fund-service

  template:

    metadata:
      labels:
        app: fund-service

    spec:

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001

      containers:

        - name: fund-service

          image: investra/fund-service:1.0.1

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8081
              protocol: TCP

          envFrom:

            - configMapRef:
                name: fund-service-config

            - secretRef:
                name: fund-service-secret

          env:

            - name: SPRING_PROFILES_ACTIVE
              value: "prod"

          resources:

            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "1"
              memory: "1Gi"

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL