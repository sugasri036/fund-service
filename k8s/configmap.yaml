apiVersion: v1
kind: ConfigMap
metadata:
  name: fund-service-config
  namespace: investra

data:

  PORT: "8081"

  NAV_SCHEDULER_ENABLED: "false"

  NAV_SCHEDULER_FIXED_DELAY: "3600000"

  NAV_SCHEDULER_LOOKBACK_DAYS: "1"

  EUREKA_ENABLED: "false"

  EUREKA_REGISTER: "false"

  EUREKA_FETCH: "false"

  DB_MAX_POOL_SIZE: "10"

  DB_MIN_IDLE: "2"

  DB_CONNECTION_TIMEOUT: "30000"

  DB_IDLE_TIMEOUT: "600000"

  DB_MAX_LIFETIME: "1800000"